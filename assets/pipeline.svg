<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="Candidate search pipeline over about 194K profiles: Voyage-3 query vectors and exhaustive ID-ordered Turbopuffer scans; filters for degree, field, school and dates; GPT-4o-mini reranking on hard and soft criteria using the text available to the evaluation judge; blind rubric verification under standards fixed before review; and live evaluation and archiving of ten candidates per role. Outputs are results/*.json, a submission ledger that permanently excludes hard failures, and a run table showing average scores from 66.6 to 90.3." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums">
<defs><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8795a3"/></marker></defs>
<rect width="1200" height="960" fill="#101418"/>
<text x="40" y="80" fill="#f2f4f6" font-size="36" font-weight="700">Candidate search pipeline</text>
<text x="40" y="120" fill="#b6c0ca" font-size="24">From ~194K profiles in Turbopuffer to ten verified candidates per role.</text>
<rect x="40" y="152" width="1120" height="96" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="64" y="209" fill="#f2f4f6" font-size="26" font-weight="700">Retrieve</text>
<text x="324" y="191" fill="#b6c0ca" font-size="23">Voyage-3 query vectors, plus exhaustive id-ordered scans</text>
<text x="324" y="221" fill="#b6c0ca" font-size="23">that cover the full population matching the hard filters.</text>
<path d="M 600 248 V 270" fill="none" stroke="#8795a3" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="40" y="272" width="1120" height="96" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="64" y="329" fill="#f2f4f6" font-size="26" font-weight="700">Filter</text>
<text x="324" y="311" fill="#b6c0ca" font-size="23">Degree, field, school and date requirements.</text>
<text x="324" y="341" fill="#b6c0ca" font-size="23">Exact recall against the structured hard criteria.</text>
<path d="M 600 368 V 390" fill="none" stroke="#8795a3" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="40" y="392" width="1120" height="96" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="64" y="449" fill="#f2f4f6" font-size="26" font-weight="700">Rerank</text>
<text x="324" y="431" fill="#b6c0ca" font-size="23">GPT-4o-mini scores hard and soft criteria using</text>
<text x="324" y="461" fill="#b6c0ca" font-size="23">only the profile text available to the evaluation judge.</text>
<path d="M 600 488 V 510" fill="none" stroke="#8795a3" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="40" y="512" width="1120" height="96" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="64" y="569" fill="#8bb8e8" font-size="26" font-weight="700">Verify</text>
<text x="324" y="551" fill="#b6c0ca" font-size="23">Blind rubric-scored judge, with standards fixed before review.</text>
<text x="324" y="581" fill="#b6c0ca" font-size="23">The judge does not see prior live scores.</text>
<path d="M 600 608 V 630" fill="none" stroke="#8795a3" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="40" y="632" width="1120" height="96" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="64" y="689" fill="#f2f4f6" font-size="26" font-weight="700">Record</text>
<text x="324" y="671" fill="#b6c0ca" font-size="23">Submit ten candidates per role to the live endpoint.</text>
<text x="324" y="701" fill="#b6c0ca" font-size="23">Archive the slate and the returned evaluation scores.</text>
<line x1="600" y1="728" x2="600" y2="752" stroke="#8795a3" stroke-width="2"/>
<line x1="218.667" y1="752" x2="981.333" y2="752" stroke="#8795a3" stroke-width="2"/>
<path d="M 218.667 752 V 774" fill="none" stroke="#8795a3" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="40" y="776" width="357.333" height="136" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="64" y="820" fill="#f2f4f6" font-size="26" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">results/*.json</tspan></text>
<text x="64" y="858" fill="#b6c0ca" font-size="23">One recorded evaluation</text>
<text x="64" y="888" fill="#b6c0ca" font-size="23">per config</text>
<path d="M 600 752 V 774" fill="none" stroke="#8795a3" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="421.333" y="776" width="357.333" height="136" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="445.333" y="820" fill="#f2f4f6" font-size="26" font-weight="700">Submission ledger</text>
<text x="445.333" y="858" fill="#b6c0ca" font-size="23">Hard failures are</text>
<text x="445.333" y="888" fill="#b6c0ca" font-size="23">permanently excluded.</text>
<path d="M 981.333 752 V 774" fill="none" stroke="#8795a3" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="802.667" y="776" width="357.333" height="136" fill="#181e24" stroke="#46515c" stroke-width="1.5"/>
<text x="826.667" y="820" fill="#f2f4f6" font-size="26" font-weight="700">Run table</text>
<text x="826.667" y="858" fill="#b6c0ca" font-size="23">Average score</text>
<text x="826.667" y="888" fill="#b6c0ca" font-size="23">66.6 to 90.3</text>
</svg>
