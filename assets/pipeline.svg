<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="Pipeline: exhaustive Turbopuffer scans and Voyage-3 vectors generate candidates, hard-criteria filters make the qualified population exact, GPT-4o-mini reranks on hard and soft criteria, and a blind rubric-scored judge verifies every candidate before the slate is recorded against the live endpoint" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bgp" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dotp" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#161d26"/></pattern>
  <linearGradient id="ndp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rlp" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a63d2" stop-opacity="0.95"/><stop offset="1" stop-color="#8a63d2" stop-opacity="0"/>
  </linearGradient>
  <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/></marker>
  <marker id="argp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
  <marker id="arop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/></marker>
  <marker id="arbp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
  <marker id="arvp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a63d2"/></marker>
</defs>
<rect x="0" y="0" width="900" height="580" fill="url(#bgp)"/>
<rect x="0" y="0" width="900" height="580" fill="url(#dotp)"/>
<text x="36" y="42" fill="#8a63d2" font-size="15" font-weight="700" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PIPELINE</text>
<text x="36" y="78" fill="#f3f6f9" font-size="25" font-weight="700">From 194K profiles to ten verified candidates per role</text>
<rect x="36" y="92" width="130" height="2.5" fill="url(#rlp)"/>
<rect x="41" y="128" width="182" height="96" fill="url(#ndp)" stroke="#8a63d2" stroke-width="1.6" rx="4"/>
<text x="132" y="158" fill="#ab8ce6" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scan + embed</text>
<text x="132" y="186" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Voyage-3 query vectors,</text>
<text x="132" y="208" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">exhaustive id-ordered scans</text>
<line x1="223" y1="176" x2="247" y2="176" stroke="#5a6673" stroke-width="1.8" marker-end="url(#arp)"/>
<rect x="253" y="128" width="182" height="96" fill="url(#ndp)" stroke="#3987e5" stroke-width="1.6" rx="4"/>
<text x="344" y="158" fill="#6fa8ec" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">filter</text>
<text x="344" y="186" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">degree, field, school, dates,</text>
<text x="344" y="208" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hard gates made exact</text>
<line x1="435" y1="176" x2="459" y2="176" stroke="#5a6673" stroke-width="1.8" marker-end="url(#arp)"/>
<rect x="465" y="128" width="182" height="96" fill="url(#ndp)" stroke="#d95926" stroke-width="1.6" rx="4"/>
<text x="556" y="158" fill="#e0763f" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">rerank</text>
<text x="556" y="186" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GPT-4o-mini, hard + soft,</text>
<text x="556" y="208" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">text-only, judge-matched</text>
<line x1="647" y1="176" x2="671" y2="176" stroke="#5a6673" stroke-width="1.8" marker-end="url(#arp)"/>
<rect x="677" y="128" width="182" height="96" fill="url(#ndp)" stroke="#199e70" stroke-width="1.6" rx="4"/>
<text x="768" y="158" fill="#35b183" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify</text>
<text x="768" y="186" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">blind rubric-scored judge,</text>
<text x="768" y="208" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">standards frozen first</text>
<text x="41" y="118" fill="#5c6773" font-size="15" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~194K profiles in</text>
<line x1="768" y1="224" x2="768" y2="268" stroke="#199e70" stroke-width="1.8" marker-end="url(#argp)"/>
<rect x="636" y="270" width="228" height="74" fill="#141d27" stroke="#8f9aa6" stroke-width="1.6" rx="4"/>
<text x="750" y="300" fill="#f3f6f9" font-size="17" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">record</text>
<text x="750" y="326" fill="#7d8896" font-size="14" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">live eval, slate archived</text>
<rect x="36" y="268" width="560" height="106" fill="#0a0e12" stroke="#4a5663" stroke-width="1.3" stroke-dasharray="6 5" rx="4"/>
<text x="58" y="296" fill="#c8d2dc" font-size="15" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the three guarantees the pipeline enforces</text>
<text x="58" y="320" fill="#7d8896" font-size="14" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hard-gate recall is exact: the full qualifying population is scanned</text>
<text x="58" y="340" fill="#7d8896" font-size="14" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the local judge reads only the text the eval judge can see</text>
<text x="58" y="360" fill="#7d8896" font-size="14" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">every recorded number is a real submission, never an estimate</text>
<line x1="316" y1="374" x2="316" y2="398" stroke="#5a6673" stroke-width="1.6" marker-end="url(#arp)"/>
<line x1="750" y1="344" x2="750" y2="398" stroke="#5a6673" stroke-width="1.6" marker-end="url(#arp)"/>
<rect x="36" y="400" width="250" height="72" fill="#1c130e" stroke="#d95926" stroke-width="1.6" rx="4"/>
<text x="161.0" y="428" fill="#e0763f" font-size="16" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">results/*.json</text>
<text x="161.0" y="452" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one recorded eval per config</text>
<rect x="330" y="400" width="264" height="72" fill="#1c130e" stroke="#d95926" stroke-width="1.6" rx="4"/>
<text x="462.0" y="428" fill="#e0763f" font-size="16" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">submission ledger</text>
<text x="462.0" y="452" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hard-fails blacklisted for good</text>
<rect x="700" y="400" width="164" height="72" fill="#1c130e" stroke="#d95926" stroke-width="1.6" rx="4"/>
<text x="782.0" y="428" fill="#e0763f" font-size="16" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">run table</text>
<text x="782.0" y="452" fill="#7d8896" font-size="13" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">66.6 to 90.3</text>
<text x="36" y="512" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Vector similarity finds the plausible; exhaustive structured scans make the qualified population exact; the LLM</text>
<text x="36" y="534" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">stages decide who actually fits. The interesting engineering is the verification layer, a blind judge calibrated</text>
<text x="36" y="556" fill="#7d8896" font-size="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">per rubric that decides whether a profile genuinely satisfies the role before its slate is ever recorded.</text>
</svg>
