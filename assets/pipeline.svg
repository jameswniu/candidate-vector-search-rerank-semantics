<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1398" width="1200" height="1398" role="img" aria-label="Pipeline: exhaustive Turbopuffer scans and Voyage-3 vectors generate candidates, hard-criteria filters make the qualified population exact, GPT-4o-mini reranks on hard and soft criteria, and a blind rubric-scored judge verifies every candidate before the slate is recorded against the live endpoint" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bgp" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="dotp" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="0.95" fill="#161d26"/></pattern>
  <linearGradient id="ndp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rlp" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a63d2" stop-opacity="0.95"/><stop offset="1" stop-color="#8a63d2" stop-opacity="0"/>
  </linearGradient>
  <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/></marker>
  <marker id="argp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
  <marker id="arop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/></marker>
  <marker id="arbp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
  <marker id="arvp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a63d2"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="1398" fill="url(#bgp)"/>
<rect x="0" y="0" width="1200" height="1398" fill="url(#dotp)"/>
<text x="48" y="64" fill="#8a63d2" font-size="23" font-weight="700" letter-spacing="5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PIPELINE</text>
<text x="48" y="120" fill="#f3f6f9" font-size="40" text-anchor="start" font-weight="700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">From 194K profiles</text>
<text x="48" y="170" fill="#f3f6f9" font-size="40" text-anchor="start" font-weight="700" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">to ten verified candidates per role</text>
<rect x="48" y="190" width="180" height="3.5" fill="url(#rlp)"/>
<text x="48" y="236" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~194K profiles in</text>
<rect x="48" y="260" width="504" height="150" fill="url(#ndp)" stroke="#8a63d2" stroke-width="2.1" rx="6"/>
<text x="300" y="310" fill="#ab8ce6" font-size="30" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scan + embed</text>
<text x="300" y="352" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Voyage-3 query vectors,</text>
<text x="300" y="386" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">exhaustive id-ordered scans</text>
<rect x="648" y="260" width="504" height="150" fill="url(#ndp)" stroke="#3987e5" stroke-width="2.1" rx="6"/>
<text x="900" y="310" fill="#6fa8ec" font-size="30" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">filter</text>
<text x="900" y="352" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">degree, field, school, dates,</text>
<text x="900" y="386" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hard gates made exact</text>
<rect x="48" y="486" width="504" height="150" fill="url(#ndp)" stroke="#d95926" stroke-width="2.1" rx="6"/>
<text x="300" y="536" fill="#e0763f" font-size="30" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">rerank</text>
<text x="300" y="578" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GPT-4o-mini, hard + soft,</text>
<text x="300" y="612" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">text-only, judge-matched</text>
<rect x="648" y="486" width="504" height="150" fill="url(#ndp)" stroke="#199e70" stroke-width="2.1" rx="6"/>
<text x="900" y="536" fill="#35b183" font-size="30" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify</text>
<text x="900" y="578" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">blind rubric-scored judge,</text>
<text x="900" y="612" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">standards frozen first</text>
<path d="M 560 335 H 642" fill="none" stroke="#5a6673" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arp)"/>
<path d="M 560 561 H 642" fill="none" stroke="#5a6673" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arp)"/>
<path d="M 900 414 V 448 H 300 V 480" fill="none" stroke="#5a6673" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arp)"/>
<rect x="48" y="686" width="668" height="300" fill="#0a0e12" stroke="#4a5663" stroke-width="1.7" stroke-dasharray="8 7" rx="6"/>
<text x="76" y="736" fill="#c8d2dc" font-size="23" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the three guarantees the pipeline enforces</text>
<rect x="76" y="769" width="8" height="8" rx="1.5" fill="#8a63d2"/>
<text x="98" y="782" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hard-gate recall is exact: the full</text>
<text x="98" y="814" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">qualifying population is scanned</text>
<rect x="76" y="841" width="8" height="8" rx="1.5" fill="#8a63d2"/>
<text x="98" y="854" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the local judge reads only the text</text>
<text x="98" y="886" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the eval judge can see</text>
<rect x="76" y="913" width="8" height="8" rx="1.5" fill="#8a63d2"/>
<text x="98" y="926" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">every recorded number is a real</text>
<text x="98" y="958" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">submission, never an estimate</text>
<rect x="752" y="774" width="400" height="124" fill="#141d27" stroke="#8f9aa6" stroke-width="2.1" rx="6"/>
<text x="952" y="826" fill="#f3f6f9" font-size="30" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">record</text>
<text x="952" y="868" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">live eval, slate archived</text>
<path d="M 952 640 V 768" fill="none" stroke="#199e70" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#argp)"/>
<rect x="48" y="1036" width="280" height="140" fill="#1c130e" stroke="#d95926" stroke-width="2.1" rx="6"/>
<text x="188" y="1082" fill="#e0763f" font-size="26" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">results/*.json</text>
<text x="188" y="1120" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one recorded eval</text>
<text x="188" y="1152" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">per config</text>
<path d="M 188 990 V 1030" fill="none" stroke="#5a6673" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arp)"/>
<rect x="364" y="1036" width="352" height="140" fill="#1c130e" stroke="#d95926" stroke-width="2.1" rx="6"/>
<text x="540" y="1082" fill="#e0763f" font-size="26" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">submission ledger</text>
<text x="540" y="1120" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hard-fails blacklisted</text>
<text x="540" y="1152" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">for good</text>
<path d="M 540 990 V 1030" fill="none" stroke="#5a6673" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arp)"/>
<rect x="752" y="1036" width="400" height="140" fill="#1c130e" stroke="#d95926" stroke-width="2.1" rx="6"/>
<text x="952" y="1082" fill="#e0763f" font-size="26" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">run table</text>
<text x="952" y="1120" fill="#7d8896" font-size="23" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">66.6 to 90.3</text>
<path d="M 952 902 V 1030" fill="none" stroke="#5a6673" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arp)"/>
<text x="48" y="1236" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Vector similarity finds the plausible; exhaustive structured scans make</text>
<text x="48" y="1269" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">the qualified population exact; the LLM stages decide who actually</text>
<text x="48" y="1302" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">fits. The interesting engineering is the verification layer, a blind</text>
<text x="48" y="1335" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">judge calibrated per rubric that decides whether a profile genuinely</text>
<text x="48" y="1368" fill="#7d8896" font-size="23" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">satisfies the role before its slate is ever recorded.</text>
</svg>
