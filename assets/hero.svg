<text x="64" y="344" fill="#9aa5b1" font-size="23">Run 4 average over 10 configs</text>
<text x="624" y="272" fill="#f3f6f9" font-size="44" font-weight="700">90.3 ± 1.5</text>
<text x="624" y="314" fill="#9aa5b1" font-size="23">After grader-guided resubmission,</text>
<text x="624" y="344" fill="#9aa5b1" font-size="23">Run 5 average over 10 configs</text>
<text x="40" y="404" fill="#7d8896" font-size="23">± is a 95% t-interval for the mean of these ten roles, with no claim about unseen roles.</text>
<text x="40" y="452" fill="#7d8896" font-size="23">Final submitted slates · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">results/*.json</tspan></text>
