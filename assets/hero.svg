<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Semantic candidate search over 194K profiles: Voyage-3 retrieval, exhaustive structured scans, hard and soft relevance filtering, GPT-4o-mini reranking, and a blind rubric-scored judge; the recorded evals average 90.3 with every hard criterion passing" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bgh" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <pattern id="doth" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#161d26"/></pattern>
  <linearGradient id="ndh" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="rlh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a63d2" stop-opacity="0.95"/><stop offset="1" stop-color="#8a63d2" stop-opacity="0"/>
  </linearGradient>
  <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/></marker>
  <marker id="argh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
  <marker id="aroh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d95926"/></marker>
  <marker id="arbh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
  <marker id="arvh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a63d2"/></marker>
</defs>
<rect x="0" y="0" width="900" height="340" fill="url(#bgh)"/>
<rect x="0" y="0" width="900" height="340" fill="url(#doth)"/>

<text x="40" y="46" fill="#8a63d2" font-size="14" font-weight="700" letter-spacing="3.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SEMANTIC SEARCH / INFORMATION RETRIEVAL</text>
<text x="40" y="102" fill="#f3f6f9" font-size="35" font-weight="700">Recall, made exact.</text>
<text x="40" y="146" fill="#f3f6f9" font-size="35" font-weight="700">Ranking, made honest.</text>
<rect x="40" y="168" width="150" height="2.5" fill="url(#rlh)"/>
<text x="40" y="200" fill="#9aa5b1" font-size="16">Candidate search over ~194K profiles: Voyage-3 vectors,</text>
<text x="40" y="224" fill="#9aa5b1" font-size="16">hard/soft relevance filters, GPT-4o-mini reranking, and a</text>
<text x="40" y="248" fill="#9aa5b1" font-size="16">blind rubric-scored judge before any slate is recorded.</text>
<rect x="40" y="278" width="104" height="28" fill="url(#ndh)" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="92.0" y="297" fill="#9aa5b1" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">retrieve</text>
<rect x="156" y="278" width="84" height="28" fill="url(#ndh)" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="198.0" y="297" fill="#9aa5b1" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">filter</text>
<rect x="252" y="278" width="96" height="28" fill="url(#ndh)" stroke="#3a4552" stroke-width="1.2" rx="3"/>
<text x="300.0" y="297" fill="#9aa5b1" font-size="15" text-anchor="middle" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">rerank</text>
<rect x="360" y="278" width="100" height="28" fill="#141d27" stroke="#8f9aa6" stroke-width="1.8" rx="3"/>
<text x="410.0" y="297" fill="#f3f6f9" font-size="15" text-anchor="middle" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify</text>
<rect x="500" y="52" width="364" height="254" fill="#0a0e12" stroke="#212b36" stroke-width="1.2" rx="4"/>
<text x="518" y="80" fill="#7d8896" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CHECKED AGAINST THE RECORDED EVALS</text>
<text x="518" y="116" fill="#ab8ce6" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">90.3</text>
<text x="628" y="116" fill="#9aa5b1" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">average final score, 10 configs</text>
<text x="518" y="154" fill="#199e70" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10 / 10</text>
<text x="628" y="154" fill="#9aa5b1" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">configs at 100% hard-criteria pass</text>
<text x="518" y="192" fill="#199e70" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10 / 10</text>
<text x="628" y="192" fill="#9aa5b1" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">configs at 80 or above</text>
<text x="518" y="230" fill="#199e70" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">8 / 10</text>
<text x="628" y="230" fill="#9aa5b1" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">configs at 90 or above</text>
<text x="518" y="268" fill="#199e70" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<text x="628" y="268" fill="#9aa5b1" font-size="13" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hard failures in 100 recorded seats</text>
</svg>
