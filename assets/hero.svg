<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" width="1200" height="704" role="img" aria-label="Candidate search over a Turbopuffer database of profiles. The pipeline as committed averaged 87.7 ± 5.0 across 10 configs (Run 4). Grader-guided resubmission raised the average to 90.3 ± 1.5 (Run 5). Each ± is a 95% t-interval for the mean of these ten roles, with no claim about unseen roles. In the final submitted slates, all 10 configs pass every hard criterion, all 10 score 80 or above, 8 score 90 or above, and there are 0 hard failures in 100 recorded seats." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums">
<defs>
<linearGradient id="bgh" x1="0" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#12161c"/><stop offset="0.55" stop-color="#0c1013"/><stop offset="1" stop-color="#080a0d"/></linearGradient>
<pattern id="doth" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="0.95" fill="#161d26"/></pattern>
<linearGradient id="ndh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19212b"/><stop offset="1" stop-color="#111820"/></linearGradient>
<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/></marker>
<marker id="ahgh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#199e70"/></marker>
</defs>
<rect width="1200" height="704" fill="url(#bgh)"/>
<rect width="1200" height="704" fill="url(#doth)"/>
<text x="40" y="84" fill="#f3f6f9" font-size="44" font-weight="700">Candidate search</text>
<text x="40" y="128" fill="#9aa5b1" font-size="24">Scans a Turbopuffer database of profiles to pick ten candidates per role,</text>
<text x="40" y="160" fill="#9aa5b1" font-size="24">checked against hard requirements and soft preferences.</text>
<rect x="40" y="196" width="1120" height="176" fill="#0a0e12" stroke="#212b36" stroke-width="1.5"/>
<line x1="600" y1="220" x2="600" y2="348" stroke="#212b36" stroke-width="1.5"/>
