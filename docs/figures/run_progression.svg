<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Average eval score across the five recorded runs, from 46.7 with strict filters and a soft-only reranker to 90.3 with exhaustive scans and a blind re-judge" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
