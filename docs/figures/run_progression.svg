<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" width="1200" height="704" role="img" aria-label="Average final score by run. Runs 2 and 3 retrieved a vector top 200 and averaged 52.1 and 66.7. Run 4, the pipeline as committed with exhaustive scans and an LLM judge, averaged 87.7. Grader-guided resubmission then reached 89.4, and Run 5 reached 90.3. Run 1 has no results file and is not drawn." font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums">
